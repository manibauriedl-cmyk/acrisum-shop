<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" role="img" aria-labelledby="title desc">
  <title id="title">SmartScreen  zwei Klicks weiter</title>
  <desc id="desc">Schema: blaue Windows-Warnung, dann Weitere Informationen, dann Trotzdem ausführen.</desc>
  <defs>
    <linearGradient id="winBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6fb5"/>
      <stop offset="100%" stop-color="#0d4f8b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c4a35a"/>
    </marker>
  </defs>
  <rect width="880" height="260" rx="12" fill="#0c1014"/>
  <!-- Schritt 1 -->
  <rect x="24" y="36" width="240" height="188" rx="10" fill="url(#winBlue)" stroke="#2a3444"/>
  <text x="144" y="68" text-anchor="middle" fill="#eef2f6" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Windows SmartScreen</text>
  <text x="144" y="92" text-anchor="middle" fill="#d8e8f8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Der PC wurde geschützt</text>
  <rect x="52" y="112" width="184" height="28" rx="4" fill="#005a9e"/>
  <text x="144" y="130" text-anchor="middle" fill="#eef2f6" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Ausführen</text>
  <rect x="52" y="148" width="184" height="28" rx="4" fill="#0078d4" stroke="#c4a35a" stroke-width="2"/>
  <text x="144" y="166" text-anchor="middle" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">Weitere Informationen</text>
  <text x="144" y="208" text-anchor="middle" fill="#8b96a8" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Schritt 1</text>
  <!-- Pfeil 1 -->
  <line x1="268" y1="130" x2="308" y2="130" stroke="#c4a35a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Schritt 2 -->
  <rect x="316" y="36" width="240" height="188" rx="10" fill="url(#winBlue)" stroke="#2a3444"/>
  <text x="436" y="68" text-anchor="middle" fill="#eef2f6" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Mehr Details</text>
  <text x="436" y="96" text-anchor="middle" fill="#d8e8f8" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Herausgeber: Manfred Adalbert Bauriedl</text>
  <text x="436" y="112" text-anchor="middle" fill="#a8c8e8" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Certum Code Signing  signiert</text>
  <rect x="344" y="132" width="184" height="32" rx="4" fill="#0078d4" stroke="#c4a35a" stroke-width="2"/>
  <text x="436" y="153" text-anchor="middle" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">Trotzdem ausführen</text>
  <text x="436" y="208" text-anchor="middle" fill="#8b96a8" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Schritt 2</text>
  <!-- Pfeil 2 -->
  <line x1="560" y1="130" x2="600" y2="130" stroke="#c4a35a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Schritt 3 -->
  <rect x="608" y="36" width="248" height="188" rx="10" fill="#141a22" stroke="#6bcf8e"/>
  <text x="732" y="78" text-anchor="middle" fill="#6bcf8e" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Setup-Assistent</text>
  <text x="732" y="108" text-anchor="middle" fill="#eef2f6" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Weiter · Weiter · Fertig</text>
  <text x="732" y="136" text-anchor="middle" fill="#8b96a8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Kein Administrator nötig</text>
  <circle cx="732" cy="172" r="18" fill="rgba(107,207,142,0.15)" stroke="#6bcf8e"/>
  <path d="M722 172 L728 178 L744 162" fill="none" stroke="#6bcf8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="208" text-anchor="middle" fill="#8b96a8" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Fertig</text>
</svg>
