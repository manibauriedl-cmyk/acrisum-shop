name: Acrisum Zaehler Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Worker deploy (Cloudflare)
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID fehlen — Worker übersprungen."
            exit 0
          fi
          npm install wrangler@3 --no-save
          npx wrangler kv namespace create ACRISUM_STATS 2>/dev/null || true
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then URL="https://acrisum-zaehler.workers.dev"; fi
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"

      - name: zaehler-api.json aktualisieren
        if: env.WORKER_URL != ''
        run: |
          python3 -c "
          import json, os
          from datetime import datetime
          from pathlib import Path
          base = os.environ.get('WORKER_URL','').rstrip('/')
          if not base: raise SystemExit(0)
          p = Path('zaehler-api.json')
          p.write_text(json.dumps({
            'api_base': base,
            'stand': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
            'hinweis': 'Cloud-Zähler (Worker, immer erreichbar)',
          }, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          "

      - name: Commit
        if: env.WORKER_URL != ''
        run: |
          git config user.name "acrisum-cloud"
          git config user.email "acrisum-cloud@users.noreply.github.com"
          git add zaehler-api.json
          git diff --staged --quiet && exit 0
          git commit -m "zaehler-api.json — Cloud Worker"
          git push
