# Tagespreis + Stripe Payment Link — täglich ohne Büro-PC.
# Einmalig: Repository → Settings → Secrets → Actions → STRIPE_SECRET_KEY
name: Tagespreis Stripe-Link

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stripe Payment Link sync
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: python scripts/sync_stripe_tagespreis.py
      - name: Commit wenn geändert
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stripe-payment-link.json
          git diff --staged --quiet && echo "Keine Änderung" && exit 0
          git commit -m "Tagespreis Stripe-Link $(date -u +%Y-%m-%d)"
          git push
