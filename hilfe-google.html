<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hilfe — Google-KI</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8b9cb3; --accent:#3d8bfd; --green:#3fb950; }
    body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:1rem; line-height:1.45; }
    h1 { font-size:1.25rem; margin:0 0 .4rem; }
    .card { background:var(--card); border-radius:12px; padding:1rem; white-space:pre-wrap; font-size:.88rem; max-height:50vh; overflow:auto; }
    .muted { color:var(--muted); font-size:.85rem; }
    .btns { display:flex; flex-direction:column; gap:.6rem; margin:1rem 0; }
    button, .btn {
      display:block; text-align:center; padding:.9rem 1rem; border-radius:10px; font-weight:700;
      border:0; background:var(--accent); color:#fff; text-decoration:none; font-size:1rem; cursor:pointer;
    }
    button.sec { background:#243044; }
    #status { color:var(--muted); font-size:.85rem; min-height:1.2em; }
  </style>
</head>
<body>
  <h1>Google-KI / BIOS-Hilfe</h1>
  <p class="muted">Wenn Sie ins BIOS gehen, hilft die lokale PC-KI nicht mehr. Nutzen Sie diesen Text am Handy.</p>
  <p id="status">Lade Prompt…</p>
  <div class="btns">
    <a class="btn" id="btnGoogle" href="#" target="_blank" rel="noopener">In Google öffnen</a>
    <button type="button" class="sec" id="btnCopy">Text kopieren</button>
  </div>
  <div class="card" id="text">…</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var sid = (q.get("s") || "").trim();
  var relay = (q.get("relay") || "").trim().replace(/\/$/, "");
  var status = document.getElementById("status");
  var textEl = document.getElementById("text");
  var btnG = document.getElementById("btnGoogle");
  var prompt = "";

  function base() {
    if (relay) return relay;
    if (location.port === "6019" || /127\.0\.0\.1|192\.168\.|10\./.test(location.hostname)) return location.origin;
    return "";
  }

  function applyPrompt(t, googleUrl) {
    prompt = t || "";
    textEl.textContent = prompt || "(kein Text)";
    btnG.href = googleUrl || ("https://www.google.com/search?q=" + encodeURIComponent(prompt.slice(0, 1600)));
    status.textContent = "Bereit — Google öffnen oder Text kopieren. BIOS-Foto danach möglich.";
  }

  document.getElementById("btnCopy").onclick = function () {
    if (!prompt) return;
    navigator.clipboard.writeText(prompt).then(function () {
      status.textContent = "Kopiert.";
    }).catch(function () {
      status.textContent = "Kopieren manuell: Text markieren.";
    });
  };

  var b = base();
  if (!sid || !b) {
    status.textContent = "Bitte QR aus dem Speicher-Manager nutzen (Sitzung + PC erreichbar).";
    return;
  }
  fetch(b + "/api/speicher/hilfe/session?s=" + encodeURIComponent(sid), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) {
        status.textContent = (d && d.fehler) || "Sitzung fehlt";
        return;
      }
      var t = d.ki_anfrage_text || d.anweisung_text || "";
      var g = (d.wege && d.wege["1_google"] && d.wege["1_google"].url_google) || "";
      applyPrompt(t, g);
    })
    .catch(function (e) {
      status.textContent = "PC nicht erreichbar: " + e;
    });
})();
</script>
</body>
</html>
